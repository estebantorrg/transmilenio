name: Android APK

# Builds the TransMilenio Explorer Android app (mobile/) and publishes the APK.
# - Push a tag like v1.0.0  -> builds + attaches the APK to a GitHub Release.
# - Manual run (workflow_dispatch) -> builds + uploads the APK as a run artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create/attach the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # master_catalog.json (Git LFS) — the mobile bundle is generated from it

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Root workspace holds the web client (client/) the shell wraps.
      - name: Install web deps
        run: npm ci

      # Capacitor CLI + Android platform bridge live in mobile/.
      - name: Install mobile deps
        working-directory: mobile
        run: npm install

      # Regenerates the APK-bundled offline data from the committed server data,
      # builds client/ into mobile/www, then copies into the Android project. The
      # native app hits the official hosts directly (spec §5.2.1b) — no API base baked.
      - name: Build web + sync Android
        working-directory: mobile
        run: npm run sync

      # A fresh runner generates a new debug keystore on every run, so each release
      # was signed with a key no other release shared — and Android refuses to
      # install an update signed differently from the app it replaces, so every
      # update meant uninstalling first (and losing saved cards and favorites).
      # One key, kept as a secret, restored to where the debug build looks for it.
      # A release without it fails here rather than ship one more throwaway key.
      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error::Secret ANDROID_KEYSTORE_B64 is not set (base64 of a debug.keystore). A release signed with this runner's throwaway key cannot be installed over the previous one."
              exit 1
            fi
            echo "::warning::Secret ANDROID_KEYSTORE_B64 is not set; this artifact is signed with a throwaway key."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      # The tag names the build: v1.26.2 -> versionName 1.26.2, versionCode 1026002
      # (app/build.gradle). A manual run on a branch keeps the gradle defaults.
      - name: Version from the tag
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
            echo "args=-PappVersionName=${GITHUB_REF_NAME#v} -PappVersionCode=$code" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace ${{ steps.version.outputs.args }}

      - name: Stage APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/transmilenio-explorer-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transmilenio-explorer-apk
          path: dist/*.apk

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
