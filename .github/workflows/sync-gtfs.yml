# Weekly refresh of the zonal schedules (spec §5.5.10, server/src/data/gtfs_zonal.json).
#
# TRANSMILENIO publishes a new static GTFS build every two weeks or so on
# Google Cloud Storage (no Colombian geofence, so the runner downloads it
# directly). `sync:gtfs` streams the ~120 MB zip, matches its trips to the
# catalog's zonal variants and writes a ~1.5 MB summary; production serves that
# file read-only from the commit (spec §5.1.3 — never parsed on the 512 MB box).
# The script refuses to write a harvest that fails its checks, which fails this
# job instead of committing it.
#
# The file carries no run date, so a week with no new build (and no catalog
# change) leaves it byte-identical and nothing is committed.
name: Sync zonal schedules (GTFS)

on:
  schedule:
    # Mondays 09:00 UTC = 04:00 Bogotá, before the morning rush; the commit
    # redeploys the one web instance.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gtfs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The matching reads the catalog's zonal variants: master_catalog.json is
      # Git LFS. Cached on the pointer's hash, as in tests.yml — the free LFS
      # bandwidth is 1 GB/month.
      - name: Restore Git LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('server/src/data/master_catalog.json') }}

      - name: Fetch Git LFS objects
        run: git lfs pull

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install server dependencies
        run: npm ci --workspace server

      - name: Regenerate zonal schedules
        id: sync
        run: |
          npm --prefix server run sync:gtfs
          echo "feed=$(node -p "require('./server/src/data/gtfs_zonal.json')._meta.feed")" >> "$GITHUB_OUTPUT"
          echo "changed=$([ -n "$(git status --porcelain server/src/data/gtfs_zonal.json)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed data
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/data/gtfs_zonal.json
          git commit -m "chore(data): refresh zonal schedules (GTFS ${{ steps.sync.outputs.feed }})"
          git push
