# Cloudflare Worker that relays the daily Salidas files to the station-demand
# sync on GitHub Actions, whose runners TRANSMILENIO's open-data host refuses
# (spec §5.8; src/index.mjs).
#
#   npx wrangler deploy            (from this folder)
#   npx wrangler tail              (watch requests live)
name = "transmi-salidas-relay"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
# The workflow calls it at its workers.dev address.
workers_dev = true
preview_urls = false

[observability]
enabled = true
